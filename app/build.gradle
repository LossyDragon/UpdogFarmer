apply plugin: 'com.android.application'

android {
    namespace "com.steevsapps.idledaddy"
    compileSdkVersion 37 // Android 17

    defaultConfig {
        applicationId "com.steevsapps.idledaddy"
        minSdkVersion 27 // Android 8
        targetSdkVersion 36 // Android 16
        versionCode 92
        versionName "2.0.50"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // buildConfigField 'String', 'AdmobAppId', IdleDaddy_AdmobAppId
            buildConfigField 'String', 'SteamApiKey', steamApiKey
            // resValue 'string', 'admob_app_id', IdleDaddy_AdmobAppId
            // resValue 'string', 'admob_ad_unit_Id', IdleDaddy_AdmobAdUnitId
        }

        debug {
            // buildConfigField 'String', 'AdmobAppId', IdleDaddy_AdmobAppId
            buildConfigField 'String', 'SteamApiKey', steamApiKey
            // resValue 'string', 'admob_app_id', IdleDaddy_AdmobAppId
            // resValue 'string', 'admob_ad_unit_Id', IdleDaddy_AdmobAdUnitId
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

ext {
    supportLibraryVersion = "27.1.1"
}

configurations.all {
    // Don't cache changing modules at all.
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    implementation("com.google.protobuf:protobuf-java:4.35.1")
    implementation ('in.dragonbra:javasteam:1.8.1-SNAPSHOT') {
        changing = true
    }
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // implementation 'com.google.android.gms:play-services-ads:17.1.3'
    // implementation 'com.google.android.ads.consent:consent-library:1.0.7'
    // implementation 'com.android.billingclient:billing:3.0.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    // implementation 'eu.chainfire:libsuperuser:1.0.0.+'
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
}