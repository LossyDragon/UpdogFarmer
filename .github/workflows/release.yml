name: Build Signed Release APK

on:
  push:
    branches: [ 2026 ]
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as the rolling pre-release instead of a full release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate: decide what this push publishes, based on :app versionCode/versionName.
  #   both changed          -> kind=release     (full release, tag v<versionCode>)
  #   only versionCode      -> kind=prerelease  (rolling pre-release, replaced each time)
  #   anything else         -> kind=none        (skip)
  # A manual run (workflow_dispatch) always proceeds; its "prerelease" input
  # picks which kind.
  # ---------------------------------------------------------------------------
  check-version:
    name: Check versionCode and versionName changed
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.diff.outputs.kind }}
      version_code: ${{ steps.diff.outputs.version_code }}
      version_name: ${{ steps.diff.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diff versionCode and versionName
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"

          # Kotlin DSL: versionCode = 101
          read_code() {
            grep -E '^\s*versionCode\s*=\s*[0-9]+' | head -n1 \
              | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/' || true
          }
          # Kotlin DSL: versionName = "3.0.2"   (does not match versionNameSuffix)
          read_name() {
            grep -E '^\s*versionName\s*=\s*"' | head -n1 \
              | sed -E 's/.*versionName\s*=\s*"([^"]*)".*/\1/' || true
          }

          CURRENT_CODE=$(read_code < "$FILE")
          CURRENT_NAME=$(read_name < "$FILE")
          echo "Current: versionCode=$CURRENT_CODE versionName=$CURRENT_NAME"
          if [[ -z "$CURRENT_CODE" || -z "$CURRENT_NAME" ]]; then
            echo "::error::Could not read versionCode/versionName from $FILE"
            exit 1
          fi
          echo "version_code=$CURRENT_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$CURRENT_NAME" >> "$GITHUB_OUTPUT"

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            if [[ "${PRERELEASE_INPUT:-}" == "true" ]]; then
              echo "No previous commit (manual run) — building a pre-release as requested."
              echo "kind=prerelease" >> "$GITHUB_OUTPUT"
            else
              echo "No previous commit (manual run or new branch) — building a release."
              echo "kind=release" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BEFORE_SHA" 2>/dev/null || {
              echo "Could not fetch $BEFORE_SHA — building a release."
              echo "kind=release" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi

          PREVIOUS=$(git show "$BEFORE_SHA:$FILE" 2>/dev/null || true)
          PREVIOUS_CODE=$(read_code <<< "$PREVIOUS")
          PREVIOUS_NAME=$(read_name <<< "$PREVIOUS")
          echo "Previous: versionCode=${PREVIOUS_CODE:-<none>} versionName=${PREVIOUS_NAME:-<none>}"

          if [[ "$CURRENT_CODE" != "$PREVIOUS_CODE" && "$CURRENT_NAME" != "$PREVIOUS_NAME" ]]; then
            echo "Both changed — building a release."
            echo "kind=release" >> "$GITHUB_OUTPUT"
          elif [[ "$CURRENT_CODE" != "$PREVIOUS_CODE" ]]; then
            echo "Only versionCode changed — building a pre-release."
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "versionCode did not change — skipping."
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build signed release APK
    needs: check-version
    if: needs.check-version.outputs.kind != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/2026' }}

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Unit tests only exist for the debug build type, so that is what runs here too.
      # A failing test stops the job before anything is signed or released.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --build-cache --stacktrace

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_steamApiKey: '"${{ secrets.STEAM_API_KEY }}"'
        run: |
          ./gradlew :app:assembleRelease --build-cache --stacktrace \
            -Pandroid.injected.signing.store.file="${{ runner.temp }}/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UpdogFarmer-release-v${{ needs.check-version.outputs.version_code }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publish a GitHub release titled "v<versionCode> - <versionName>" with the
  # signed APK attached. Separate job so only this one gets a write token.
  #   release:    tag v<versionCode>, never overwritten.
  #   prerelease: fixed tag "pre-release"; the previous one is deleted and
  #               recreated at this commit, so there is only ever one.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub release
    needs: [ check-version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION_CODE: ${{ needs.check-version.outputs.version_code }}
      VERSION_NAME: ${{ needs.check-version.outputs.version_name }}
      KIND: ${{ needs.check-version.outputs.kind }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: UpdogFarmer-release-v${{ needs.check-version.outputs.version_code }}
          path: apk

      - name: Create release
        run: |
          set -euo pipefail
          APK=$(find apk -name '*.apk' | head -n1)

          if [[ "$KIND" == "prerelease" ]]; then
            TAG="pre-release"
            NAMED="UpdogFarmer-v${VERSION_CODE}-${VERSION_NAME}-pre.apk"
            mv "$APK" "$NAMED"

            # Rolling pre-release: drop the old release and its tag so the tag
            # is recreated at this commit.
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes --cleanup-tag
            fi
            # A tag left behind without a release would pin the new one to an old commit.
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true

            gh release create "$TAG" "$NAMED" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION_CODE} - ${VERSION_NAME} (pre-release)" \
              --prerelease \
              --generate-notes
            exit 0
          fi

          TAG="v${VERSION_CODE}"

          # Re-runs and manual runs must not fail or overwrite an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          NAMED="UpdogFarmer-v${VERSION_CODE}-${VERSION_NAME}.apk"
          mv "$APK" "$NAMED"

          gh release create "$TAG" "$NAMED" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION_CODE} - ${VERSION_NAME}" \
            --generate-notes
