name: Build Signed Release APK

on:
  push:
    branches: [ 2026 ]
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate: only proceed if :app versionCode actually changed in this push.
  # ---------------------------------------------------------------------------
  check-version:
    name: Check versionCode changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version_code: ${{ steps.diff.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diff versionCode
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          FILE="app/build.gradle.kts"

          # Kotlin DSL: "versionCode = 101"
          CURRENT=$(grep -E '^\s*versionCode\s*=\s*[0-9]+' "$FILE" | head -n1 | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/')
          echo "Current versionCode: $CURRENT"
          echo "version_code=$CURRENT" >> "$GITHUB_OUTPUT"

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No previous commit — treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$BEFORE_SHA" 2>/dev/null || {
              echo "Could not fetch $BEFORE_SHA — treating as changed."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi

          PREVIOUS=$(git show "$BEFORE_SHA:$FILE" 2>/dev/null \
            | grep -E '^\s*versionCode\s*=\s*[0-9]+' \
            | head -n1 \
            | sed -E 's/.*versionCode\s*=\s*([0-9]+).*/\1/' || true)
          echo "Previous versionCode: ${PREVIOUS:-<none>}"

          if [[ "$CURRENT" != "$PREVIOUS" ]]; then
            echo "versionCode changed: ${PREVIOUS:-<none>} -> $CURRENT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "versionCode unchanged — skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build signed release APK
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/2026' }}

      - name: Cache Android SDK build-cache
        uses: actions/cache@v6
        with:
          path: ~/.android/build-cache
          key: ${{ runner.os }}-android-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_steamApiKey: '"${{ secrets.STEAM_API_KEY }}"'
        run: |
          ./gradlew :app:assembleRelease --build-cache --stacktrace \
            -Pandroid.injected.signing.store.file="${{ runner.temp }}/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UpdogFarmer-release-v${{ needs.check-version.outputs.version_code }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30