[versions]
activityCompose = "1.13.0"
agp = "9.2.1"
androidxMedia = "1.8.0"
androidxPreference = "1.2.1"
bouncycastleVersion = "1.84"
coil = "3.5.0"
composeBom = "2026.06.01"
composeMaterial3 = "1.5.0-alpha23"
composePreference = "2.2.0"
depAnalysis = "3.16.1" # https://mvnrepository.com/artifact/com.autonomousapps.dependency-analysis
gsonVersion = "2.14.0"
javaSteam = "1.8.1-SNAPSHOT"
jsoup = "1.22.2"
koinBom = "4.2.2" # https://mvnrepository.com/artifact/io.insert-koin/koin-core
kotlin = "2.4.0"
kotlinxSerialization = "1.11.0"
lifecycle = "2.11.0"
navigation3 = "1.1.4"
protobufs = "4.35.1"
retrofitVersion = "3.0.0"
zxing = "3.5.4"

# Testing
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
junit = "4.13.2"

[libraries]
# AndroidX views (service notifications + preferences)
androidx-media = { module = "androidx.media:media", version.ref = "androidxMedia" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "androidxPreference" }

# Compose (versions come from the BOM unless pinned)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Lifecycle
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# Navigation 3
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# Steam / crypto
javasteam = { module = "in.dragonbra:javasteam", version.ref = "javaSteam" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobufs" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastleVersion" }

# Network / data
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofitVersion" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofitVersion" }
gson = { module = "com.google.code.gson:gson", version.ref = "gsonVersion" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# Images
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Misc
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
compose-preference = { module = "me.zhanghai.compose.preference:preference", version.ref = "composePreference" }

# Dependency injection
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinBom" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[bundles]
javasteam = ["protobuf-java", "javasteam"]
androidx-ui = ["androidx-preference", "androidx-media"]
compose = [
    "compose-material3",
    "compose-material-icons-core",
    "compose-material-icons-extended",
    "compose-ui-tooling-preview",
    "androidx-activity-compose",
]
lifecycle = ["lifecycle-viewmodel-compose", "lifecycle-runtime-compose"]
navigation = ["navigation3-ui", "lifecycle-viewmodel-navigation3"]
coil = ["coil-compose", "coil-network-okhttp"]
network = ["retrofit", "converter-gson", "gson"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "depAnalysis" }